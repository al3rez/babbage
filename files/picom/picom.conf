# macOS-style compositing for XFCE on NVIDIA (proprietary driver); xfwm4 compositor is disabled
backend = "glx";
vsync = true;
use-damage = false;              # NVIDIA: avoids flicker/partial-redraw artifacts
xrender-sync-fence = true;       # NVIDIA: sync X rendering with GL to prevent stutter/tearing
unredir-if-possible = false;     # keep composited; unredirect toggling flickers on NVIDIA
detect-client-opacity = true;
detect-rounded-corners = true;
# a dialog and its parent window count as focused together (used by the dim rule below)
detect-transient = true;

# macOS look: 10pt window corners (15px at 1.5x); the rules below keep the bars, menus,
# notifications and fullscreen windows square. Focus dimming is a rule too: with `rules`
# set, picom ignores the old inactive-dim / mark-*-focused options (picom(1), WINDOW RULES).
corner-radius = @radius@;

shadow = false;
shadow-radius = 32;
shadow-opacity = 0.38;
shadow-offset-x = -32;
shadow-offset-y = -22;

# frosted glass behind the launcher and menus (rules below); glx only, the VM's xrender skips it
blur: { method = "dual_kawase"; strength = 9; };

fading = true;
fade-delta = 6;

rules = (
  # blur is opt-in (launcher and menus below): with a blur method set, picom blurs every
  # transparent window, and blurring the transparent bars pulls in the black off-screen area
  # beside the monitors, darkening the LG bar's end and the whole ASUS bar
  { blur-background = false; },   # no match: applies to every window
  # notifications slide down into the menu bar, and back up out of it
  { match = "class_g = 'Dunst'"; shadow = false; corner-radius = 0;
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "down"; duration = 0.22; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "up"; duration = 0.18; }
    ); },
  # app windows: macOS edge gloss (files/picom/gloss.frag, filled in by modules/compositor.nix)
  { match = "window_type = 'normal' || window_type = 'dialog'"; shadow = false; corner-radius = @radius@; @gloss@ },
  # every app window that isn't focused is dimmed
  { match = "(window_type = 'normal' || window_type = 'dialog') && !(focused || group_focused) && class_g != 'Rofi'"; dim = 0.18; },
  # the launcher: frosted, rounded to match its theme (files/rofi/launcher.rasi), soft shadow
  { match = "class_g = 'Rofi'"; blur-background = true; corner-radius = 18; shadow = true; },
  # Clipboard History (files/bin/clipboard-history): the launcher's window, so the same frost and
  # gloss (it's a utility window, which the app-window gloss rule above doesn't cover)
  { match = "class_g = 'Clipboard-history'"; blur-background = true; corner-radius = 18; shadow = true; @gloss@ },
  # notification dot under a pinned app (files/bin/menubar-popovers): a 6px square made round
  { match = "class_g = 'Menubar-badge'"; corner-radius = 3; shadow = false; blur-background = false; },
  # the tray popovers (files/bin/menubar-popovers): frosted card, 12pt corners
  { match = "class_g = 'Menubar-popover'"; blur-background = true; corner-radius = 18; opacity = 0.92; shadow = true; },
  { match = "class_g = 'Xfce4-panel' || window_type = 'dock' || window_type = 'desktop' || class_g = 'Xfdesktop'";
    corner-radius = 0; shadow = false; },
  { match = "window_type = 'tooltip' || window_type = 'combo'"; corner-radius = 0; },
  # menus: rounded and frosted to match their gtk.css (files/gtk-3.0/gtk.css)
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'";
    corner-radius = 18; blur-background = true; opacity = 0.90; },
  { match = "fullscreen"; corner-radius = 0; shadow = false; @plain@ },
  { match = "class_g = 'Xfce4-screenshooter'"; shadow = false; corner-radius = 0; },
);
