# macOS-style compositing for XFCE on NVIDIA (proprietary driver); xfwm4 compositor is disabled
backend = "glx";
vsync = true;
use-damage = false;              # NVIDIA: avoids flicker/partial-redraw artifacts
xrender-sync-fence = true;       # NVIDIA: sync X rendering with GL to prevent stutter/tearing
unredir-if-possible = false;     # keep composited; unredirect toggling flickers on NVIDIA
detect-client-opacity = true;
detect-rounded-corners = true;
# a dialog and its parent window count as focused together (used by the dim rule below)
detect-transient = true;

# macOS look: 10pt window corners (15px at 1.5x); the rules below keep the bars, menus,
# notifications and fullscreen windows square. Focus dimming is a rule too: with `rules`
# set, picom ignores the old inactive-dim / mark-*-focused options (picom(1), WINDOW RULES).
corner-radius = 15;

shadow = false;
shadow-radius = 32;
shadow-opacity = 0.38;
shadow-offset-x = -32;
shadow-offset-y = -22;

# frosted glass behind the launcher (rule below); glx only, the VM's xrender skips it
blur: { method = "dual_kawase"; strength = 7; };

fading = true;
fade-delta = 6;

rules = (
  # notifications slide down into the menu bar, and back up out of it
  { match = "class_g = 'Dunst'"; shadow = false; corner-radius = 0;
    animations = (
      { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "down"; duration = 0.22; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "up"; duration = 0.18; }
    ); },
  { match = "window_type = 'normal' || window_type = 'dialog'"; shadow = false; corner-radius = 15; },
  # every app window that isn't focused is dimmed
  { match = "(window_type = 'normal' || window_type = 'dialog') && !(focused || group_focused) && class_g != 'Rofi'"; dim = 0.18; },
  # the launcher: frosted, rounded to match its theme (files/rofi/launcher.rasi), soft shadow
  { match = "class_g = 'Rofi'"; blur-background = true; corner-radius = 18; shadow = true; },
  { match = "class_g = 'Xfce4-panel' || window_type = 'dock' || window_type = 'desktop' || class_g = 'Xfdesktop'";
    corner-radius = 0; shadow = false; },
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'combo'";
    corner-radius = 0; },
  { match = "fullscreen"; corner-radius = 0; shadow = false; },
  { match = "class_g = 'Xfce4-screenshooter'"; shadow = false; corner-radius = 0; },
);
