# NVIDIA RTX 5070 (PCI 01:00.0): LG UltraGear on DP-2 (primary, 4K@240) and ASUS MB16FC on DP-4
# at its native 1920x1200@75 (no driver scaling: sharpest; at 144 DPI the UI is 150%),
# bottom edges aligned.
#
# HardDPMS "false": when the idle timer turns the monitors off, blank the signal instead of
# powering the DisplayPort links down. With hard DPMS the monitors drop off the bus, the
# driver forgets the layout, and anything that re-applies it while they sleep stalls the
# X server (keyboard and mouse) for ~45s per attempt. Soft DPMS keeps them connected: no
# disconnect, no layout change, nothing to repair.
#
# MetaModes: dual layout only. Do not add an ASUS-only fallback (+0+0): the driver switches
# to it after wake/RandR churn and the LG looks unplugged until something re-applies MetaMode.
# Everything else stays auto-configured (the AMD iGPU is still added as a secondary GPU).
Section "Device"
    Identifier "nvidia"
    Driver     "nvidia"
    BusID      "PCI:1:0:0"
    Option     "HardDPMS" "false"
    Option     "nvidiaXineramaInfoOrder" "DP-2"    # LG first, so it is the RandR primary
    Option     "MetaModes" "DP-2: 3840x2160_240 +0+0 {ForceCompositionPipeline=On}, DP-4: 1920x1200_75 +3840+960 {ForceCompositionPipeline=On}"
EndSection
